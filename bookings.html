<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyDesk - My bookings</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <div class="top-bar">
        <div class="top-left">
            <a href="flights.html" class="brand-logo">SkyDesk</a>
            <div class="top-nav">
                <a href="passenger.html">Home</a>
            </div>
        </div>

    </div>

    <div class="bookings-wrap">
        <h1 class="main-heading">My bookings</h1>

        <!-- Booking Card 1 -->
        <div class="booking-card">
            <div class="booking-info">
                <p class="pnr-text">FLIGHT 1</p>
                <h2 class="route-title">DAC ➜ CXB</h2>
                <p class="flight-sub">Fri, 6 Nov </p>
            </div>

            <div class="booking-status">
                <span class="badge-confirmed">Confirmed</span>
            </div>

            <div class="booking-actions">
                <a href="#" class="btn-card-primary">Check-in</a>
                <a href="#" class="btn-card-outline">Change</a>
                <a href="#" class="btn-card-outline">Cancel</a>
            </div>
        </div>

        <!-- Booking Card 2 -->
        <div class="booking-card">
            <div class="booking-info">
                <p class="pnr-text">FLIGHT 2</p>
                <h2 class="route-title">DAC ➜ CGP</h2>
                <p class="flight-sub">Sun, 22 Nov </p>
            </div>

            <div class="booking-status">
                <span class="badge-confirmed">Confirmed</span>
            </div>

            <div class="booking-actions">
                <a href="#" class="btn-card-outline">View ticket</a>
                <a href="#" class="btn-card-outline">Change</a>
            </div>
        </div>

        <!-- Booking Card 3 -->
        <div class="booking-card">
            <div class="booking-info">
                <p class="pnr-text">FLIGHT 3</p>
                <h2 class="route-title">CXB ➜ DAC</h2>
                <p class="flight-sub">Wed, 9 Dec </p>
            </div>

            <div class="booking-status">
                <span class="badge-cancelled">Cancelled</span>
            </div>

            <div class="booking-actions">
                <a href="#" class="btn-card-outline">View details</a>
            </div>
        </div>
    </div>
</body>

</html>
