<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyDesk - Booking Confirmed</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <div class="top-bar">
        <div class="top-left">
            <a href="flights.html" class="brand-logo">SkyDesk</a>
            
        </div>
    </div>

    <div class="confirm-wrap">
        <div class="confirm-card">
            <div class="check-circle">&#10003;</div>

            <h1 class="confirm-title">Thank you for your purchase!</h1>

            <p class="confirm-text">
                Your booking is confirmed. We've sent your e-ticket to your email.
            </p>

            <p class="confirm-subtext">
                Have a pleasant flight with SkyDesk Airlines.
            </p>

            <div class="confirm-actions">
                <a href="bookings.html" class="btn-primary-link">View my booking</a>
                <a href="flights.html" class="btn-outline-link">Back to home</a>
            </div>
        </div>
    </div>
</body>

</html>
